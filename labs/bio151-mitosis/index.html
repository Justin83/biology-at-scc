<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIO 151 Mitosis Lab · Enter Counts</title>
<meta name="description" content="Student form for the BIO 151 mitosis lab at Somerset Community College: count cells in each stage of the cell cycle in two regions.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../bio151-spectro/lab.css">
<link rel="stylesheet" href="mitosis.css">
<link rel="icon" href="data:,">
</head>
<body>
<header class="lab">
  <div class="wrap">
    <a class="brand" href="../../index.html">Biology <span>at SCC</span></a>
    <span class="sub">Mitosis Lab · student counts</span>
  </div>
</header>

<main class="wrap" id="main">
  <h1 id="title">Loading…</h1>
  <p class="lede" id="course"></p>
  <div id="boot-msg" class="msg warn hidden" role="status"></div>

  <form id="form" class="hidden" novalidate>
    <div class="names">
      <div>
        <label for="first">First name <span class="req" aria-hidden="true">*</span></label>
        <input id="first" type="text" maxlength="40" autocomplete="given-name" autocapitalize="words" required>
      </div>
      <div>
        <label for="last">Last name <span class="req" aria-hidden="true">*</span></label>
        <input id="last" type="text" maxlength="40" autocomplete="family-name" autocapitalize="words" required>
      </div>
    </div>
    <p class="muted small" style="margin:.4rem 0 0">Only your instructor sees your name.</p>

    <div id="tables"></div>
    <p class="small" style="margin-top:1rem"><button type="button" id="new-btn" class="link hidden">Not you? Start a new submission on this device</button></p>
  </form>
</main>

<div id="savebar" class="savebar hidden">
  <div class="inner">
    <div id="save-state" class="state" role="status" aria-live="polite">Not saved yet</div>
    <button id="save-btn" class="primary" type="submit" form="form">Save</button>
  </div>
</div>

<script src="config.js"></script>
<script src="mitosis-api.js"></script>
<script src="student.js"></script>
</body>
</html>
